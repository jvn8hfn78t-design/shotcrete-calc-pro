name: Generar Keystore de Firma

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generar keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore shotcrete-release.keystore \
            -alias shotcrete \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Shotcrete Calc Batch, OU=App, O=Shotcrete Calc Batch, L=Lima, ST=Lima, C=PE"

      - name: Guardar keystore
        uses: actions/upload-artifact@v4
        with:
          name: shotcrete-release-keystore
          path: shotcrete-release.keystore
