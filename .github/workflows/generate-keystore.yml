name: Generar Keystore de Firma

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generar keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore shotcrete-release.keystore \
            -alias shotcrete \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=Shotcrete Calc Batch, OU=App, O=Shotcrete Calc Batch, L=Lima, ST=Lima, C=PE"

      - name: Verificar keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "========================================"
          echo "VERIFICANDO KEYSTORE ORIGINAL"
          echo "========================================"

          keytool -list \
            -v \
            -keystore shotcrete-release.keystore \
            -storepass "$KEYSTORE_PASSWORD"

          echo ""
          echo "Keystore original válida."

      - name: Crear Base64
        run: |
          base64 -w 0 shotcrete-release.keystore > shotcrete-release-keystore.txt

          echo ""
          echo "========================================"
          echo "BASE64 GENERADO"
          echo "========================================"

          wc -c shotcrete-release.keystore
          wc -c shotcrete-release-keystore.txt

      - name: Guardar archivos
        uses: actions/upload-artifact@v4
        with:
          name: shotcrete-release-keystore-base64
          path: |
            shotcrete-release.keystore
            shotcrete-release-keystore.txt
