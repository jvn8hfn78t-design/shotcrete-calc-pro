name: Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Compilar aplicación web
        run: bun run build

      - name: Revisar salida del build
        run: |
          echo "=== RAÍZ ==="
          ls -la
          echo "=== DIST ==="
          ls -la dist 2>/dev/null || true
          echo "=== OUTPUT ==="
          ls -la .output 2>/dev/null || true
          echo "=== INDEX.HTML ==="
          find . -maxdepth 5 -name "index.html" -type f

      - name: Instalar Capacitor CLI
        run: bunx cap --version

      - name: Crear proyecto Android
        run: bunx cap add android

      - name: Sincronizar Capacitor
        run: bunx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: pdr-shotcrete-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
